# Fresh backup policy rules.
# Paths are relative to $HOME and may use shell glob patterns.
# Rules inside the compatibility block preserve the historical
# "hardcoded rule" label in `dotcfg check-exclude` output.

# DOTCFG_COMPATIBILITY_RULES_BEGIN
Downloads/*
Desktop/*
Documents/*
Videos/*
Music/*
Pictures/*
.cache/*
.local/share/Trash/*
.thumbnails/*
.npm/*
.cargo/*
.config/microsoft-edge/*
.config/nvm/*
.config/chromium/*
.config/google-chrome-for-testing/*
.bash_history
.zsh_history
.lesshst
.viminfo
*.log
*.tmp
*.swp
core.*
# DOTCFG_COMPATIBILITY_RULES_END

# Add machine-specific rules below this line. They are reported as
# `exclude.conf` rules by `dotcfg check-exclude`.
