# ============================================
# VERSION = "1.0.0"
# NAME = "categories"
# DESCRIPTION = "full、min 和 macos 正式部署分类"
# TAG = "stable"
# VALID_TAGS = "stable,test,experimental"
# CATEGORY_ALIASES = "desktop:full,server:min"
# STATE_DEFAULT = "min"
# STATE_INDICATORS = "full:.xinitrc,full:.xprofile,full:.config/x11/xinitrc"
# ============================================

# macOS 和 Linux 均可使用的命令行基础配置。
category = macos
+ .bashrc
+ .zshrc
+ .profile
+ .zprofile
+ .gitconfig
+ .gitignore
+ .npmrc
+ .config/git/ignore
+ .config/shell/aliasrc
+ .config/shell/bm-dirs
+ .config/shell/bm-files
+ .config/shell/inputrc
+ .config/shell/profile
+ .config/shell/zprofile
+ .config/zsh/.zshrc
+ .config/tmux/tmux.conf
+ .config/tmux/tmux.conf.local

# Linux 最小命令行环境；不包含普通 ~/.local/bin 脚本。
category = min
include = macos
+ .custom.el
+ .fbtermrc
+ .config/lf/cleaner
+ .config/lf/icons
+ .config/lf/lfrc
+ .config/lf/scope
+ .config/mpd/mpd.conf
+ .config/ncmpcpp/bindings
+ .config/ncmpcpp/config
+ .config/newsboat/config
+ .config/newsboat/urls
+ .config/wget/wgetrc
