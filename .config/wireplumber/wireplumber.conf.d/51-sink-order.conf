# Verified 2026-10-30. Bluetooth, else onboard analog.
# The dock USB sink has no jack control, so it stays manual and below
# onboard; an empty dock jack would keep the default forever.
# A saved wpctl default gets +30000 and would block this.

wireplumber.settings = {
  node.restore-default-targets = false
}

monitor.bluez.rules = [
  {
    matches = [
      {
        node.name = "~bluez_output.*"
      }
    ]
    actions = {
      update-props = {
        priority.session = 3000
      }
    }
  }
]

monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "alsa_output.pci-0000_06_00.6.analog-stereo"
      }
    ]
    actions = {
      update-props = {
        priority.session = 1500
      }
    }
  }
  {
    matches = [
      {
        node.name = "~alsa_output.usb-.*-Generic_USB_Audio-.*-00.*"
      }
    ]
    actions = {
      update-props = {
        priority.session = 900
      }
    }
  }
]
